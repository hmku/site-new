<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="theme-color" content="#f4f0e8">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta name="twitter:card" content="summary">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="site-nav"><a class="wordmark" href="{{ '/' | relative_url }}">HK<span>.</span></a><nav aria-label="Primary"><a href="{{ '/about/' | relative_url }}">About</a><a href="{{ '/projects/' | relative_url }}">Projects</a><a href="{{ '/music/' | relative_url }}">Music</a><a href="{{ '/travel/' | relative_url }}">Travel</a></nav><a class="contact-link" href="mailto:{{ site.email }}">Get in touch <span>↗</span></a></header>
    <main>{{ content }}</main>
    <footer><span>© {{ 'now' | date: '%Y' }} Harrison Ku</span><div><a href="https://github.com/{{ site.github_username }}">GitHub</a><a href="https://linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a></div></footer>
  </body>
</html>
